services:
  # SERVICE A: Data Ingestion
  data-ingestion:
    build: ./services/data-ingestion
    expose:
      - "8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/data_ingestion.db
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-single-node}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - MARKET_DATA_MODE=${MARKET_DATA_MODE:-live}
      - BINANCE_REST_URL=${BINANCE_REST_URL:-https://api.binance.com/api/v3}
      - YAHOO_CHART_URL=${YAHOO_CHART_URL:-https://query2.finance.yahoo.com/v8/finance/chart}
      - ALPACA_DATA_URL=${ALPACA_DATA_URL:-https://data.alpaca.markets/v2}
      - ALPACA_TRADING_URL=${ALPACA_TRADING_URL:-https://paper-api.alpaca.markets}
    volumes:
      - data-ingestion-db:/app/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      portfolio-engine:
        condition: service_healthy

  # SERVICE B: Quantitative Analytics & Risk Engine
  quant-engine:
    build: ./services/quant-engine
    expose:
      - "8001"
    environment:
      - RISK_REWARD_RATIO=${RISK_REWARD_RATIO:-3.0}
      - ATR_STOP_MULTIPLIER=${ATR_STOP_MULTIPLIER:-1.5}
      - TRAILING_STOP_PCT=${TRAILING_STOP_PCT:-0.02}
      - ATR_VOLATILITY_THRESHOLD=${ATR_VOLATILITY_THRESHOLD:-2.0}
      - SCAN_INTERVAL_MINUTES=${SCAN_INTERVAL_MINUTES:-15}
      - SCAN_ENABLED=${SCAN_ENABLED:-true}
      - MARKET_HOURS_ONLY=${MARKET_HOURS_ONLY:-true}
      - DATA_INGESTION_URL=http://data-ingestion:8000
      - PORTFOLIO_ENGINE_URL=http://portfolio-engine:8002
      - NOTIFICATION_GATEWAY_URL=http://notification-gateway:8003
      - BACKTEST_DATABASE_PATH=/app/data/backtests.db
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-single-node}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - quant-engine-db:/app/data
    networks:
      - trading_network
    depends_on:
      data-ingestion:
        condition: service_healthy
      portfolio-engine:
        condition: service_started
      notification-gateway:
        condition: service_started

  # SERVICE C: Portfolio & Integration Engine
  portfolio-engine:
    build: ./services/portfolio-engine
    expose:
      - "8002"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/portfolio.db
      - QUANT_ENGINE_URL=http://quant-engine:8001
      - DATA_INGESTION_URL=http://data-ingestion:8000
      - HOST_ENV_PATH=/workspace/.env
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-single-node}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - portfolio-db:/app/data
      - ./.env:/workspace/.env
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # NOTIFICATION GATEWAY (part of Service D)
  notification-gateway:
    build: ./services/notification-gateway
    expose:
      - "8003"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - NOTIFY_TELEGRAM_ENABLED=${NOTIFY_TELEGRAM_ENABLED:-true}
      - NOTIFY_DISCORD_ENABLED=${NOTIFY_DISCORD_ENABLED:-true}
      - NOTIFY_SLACK_ENABLED=${NOTIFY_SLACK_ENABLED:-true}
      - NOTIFY_EMAIL_ENABLED=${NOTIFY_EMAIL_ENABLED:-true}
      - NOTIFY_SMS_ENABLED=${NOTIFY_SMS_ENABLED:-true}
      - PORTFOLIO_ENGINE_URL=http://portfolio-engine:8002
      - DEPLOYMENT_PROFILE=${DEPLOYMENT_PROFILE:-single-node}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - NOTIFICATION_MODE=${NOTIFICATION_MODE:-live}
      - TELEGRAM_API_BASE_URL=${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      - TWILIO_API_BASE_URL=${TWILIO_API_BASE_URL:-https://api.twilio.com}
    networks:
      - trading_network
    depends_on:
      data-ingestion:
        condition: service_healthy
      portfolio-engine:
        condition: service_started

  # SERVICE D: Frontend (React + Nginx reverse proxy)
  frontend:
    build: ./services/frontend
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    networks:
      - trading_network
    depends_on:
      data-ingestion:
        condition: service_healthy
      quant-engine:
        condition: service_started
      portfolio-engine:
        condition: service_started
      notification-gateway:
        condition: service_started

networks:
  trading_network:
    driver: bridge

volumes:
  data-ingestion-db:
  quant-engine-db:
  portfolio-db:
