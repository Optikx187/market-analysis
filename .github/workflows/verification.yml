name: Verification

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      backend_matrix: ${{ steps.plan.outputs.backend_matrix }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      run_frontend: ${{ steps.plan.outputs.run_frontend }}
      run_management: ${{ steps.plan.outputs.run_management }}
      run_compose: ${{ steps.plan.outputs.run_compose }}
      run_docs: ${{ steps.plan.outputs.run_docs }}
      high_risk: ${{ steps.plan.outputs.high_risk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify verification jobs
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes changed \
            --base-ref "origin/$BASE_BRANCH" \
            --dry-run \
            --json artifacts/verification/classification.json \
            --junit artifacts/verification/classification.xml
      - id: plan
        name: Export portable job plan
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("artifacts/verification/classification.json").read_text()
          )
          plan = report["ci_plan"]
          outputs = {
              "backend_matrix": json.dumps(plan["backend_services"], separators=(",", ":")),
              "image_matrix": json.dumps(plan["image_services"], separators=(",", ":")),
              "run_frontend": str(plan["run_frontend"]).lower(),
              "run_management": str(plan["run_management"]).lower(),
              "run_compose": str(plan["run_compose"]).lower(),
              "run_docs": str(plan["run_docs"]).lower(),
              "high_risk": str(plan["high_risk"]).lower(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Upload classification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-classification
          path: artifacts/verification/
          if-no-files-found: error

  repository:
    name: Repository hygiene
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check changed whitespace
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          git diff --check "$(git merge-base "origin/$BASE_BRANCH" HEAD)...HEAD"

  backend:
    name: Backend / ${{ matrix.service }}
    if: needs.classify.outputs.backend_matrix != '[]'
    needs: classify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.classify.outputs.backend_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install service dependencies
        run: |
          python -m pip install \
            -r "services/${{ matrix.service }}/requirements.txt" \
            pytest \
            pytest-asyncio
      - name: Verify service
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes service "${{ matrix.service }}" \
            --base-ref "origin/$BASE_BRANCH" \
            --json "artifacts/verification/${{ matrix.service }}.json" \
            --junit "artifacts/verification/${{ matrix.service }}.xml"
      - name: Upload service report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.service }}
          path: artifacts/verification/
          if-no-files-found: error

  frontend:
    name: Frontend typecheck and build
    if: needs.classify.outputs.run_frontend == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: services/frontend
      - name: Verify frontend
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes service frontend \
            --base-ref "origin/$BASE_BRANCH" \
            --json artifacts/verification/frontend.json \
            --junit artifacts/verification/frontend.xml
      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-frontend
          path: artifacts/verification/
          if-no-files-found: error

  management:
    name: Management tooling
    if: needs.classify.outputs.run_management == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify management tooling
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes service management \
            --base-ref "origin/$BASE_BRANCH" \
            --json artifacts/verification/management.json \
            --junit artifacts/verification/management.xml
      - name: Upload management report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-management
          path: artifacts/verification/
          if-no-files-found: error

  windows-entrypoint:
    name: Windows PowerShell entry point
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.classify.outputs.run_management == 'true'
    needs: classify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Plan full verification through PowerShell
        shell: pwsh
        run: |
          .\verify-changes.ps1 full `
            --dry-run `
            --json artifacts\verification\windows.json `
            --junit artifacts\verification\windows.xml
      - name: Upload Windows report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-windows
          path: artifacts/verification/
          if-no-files-found: error

  docs:
    name: Documentation links
    if: needs.classify.outputs.run_docs == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify documentation
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes service docs \
            --base-ref "origin/$BASE_BRANCH" \
            --json artifacts/verification/docs.json \
            --junit artifacts/verification/docs.xml
      - name: Upload documentation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-docs
          path: artifacts/verification/
          if-no-files-found: error

  images:
    name: Image / ${{ matrix.service }}
    if: needs.classify.outputs.image_matrix != '[]'
    needs: classify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.classify.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: build
        name: Build changed image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: market-analysis-${{ matrix.service }}:verification
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Write image metadata
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p artifacts/verification
          printf '%s\n' "$BUILD_METADATA" > "artifacts/verification/image-${{ matrix.service }}.json"
          printf '%s\n' "$BUILD_DIGEST" > "artifacts/verification/image-${{ matrix.service }}.digest"
      - name: Upload image metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-image-${{ matrix.service }}
          path: artifacts/verification/
          if-no-files-found: error

  compose:
    name: Sandbox Compose smoke
    if: needs.classify.outputs.run_compose == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run fake-provider smoke
        env:
          COMPOSE_PROJECT_NAME: market-analysis-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/ci_sandbox_smoke.sh artifacts/verification
      - name: Upload Compose report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-compose
          path: artifacts/verification/
          if-no-files-found: error

  full-system:
    name: Full-system verification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.classify.outputs.high_risk == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/data-ingestion/requirements.txt
            services/quant-engine/requirements.txt
            services/portfolio-engine/requirements.txt
            services/notification-gateway/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Install all dependencies
        run: |
          python -m pip install \
            -r services/data-ingestion/requirements.txt \
            -r services/quant-engine/requirements.txt \
            -r services/portfolio-engine/requirements.txt \
            -r services/notification-gateway/requirements.txt
          npm ci --prefix services/frontend
      - name: Run full verification
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          ./verify-changes full \
            --base-ref "origin/$BASE_BRANCH" \
            --json artifacts/verification/full.json \
            --junit artifacts/verification/full.xml
      - name: Upload full-system report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-full-system
          path: artifacts/verification/
          if-no-files-found: error

  security:
    name: Dependency security audit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.classify.outputs.high_risk == 'true'
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/data-ingestion/requirements.txt
            services/quant-engine/requirements.txt
            services/portfolio-engine/requirements.txt
            services/notification-gateway/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit
          mkdir -p artifacts/security
          status=0
          for service in data-ingestion quant-engine portfolio-engine notification-gateway; do
            pip-audit \
              --requirement "services/$service/requirements.txt" \
              --format json \
              --output "artifacts/security/$service.json" || status=1
          done
          (
            cd services/frontend
            npm audit --package-lock-only --audit-level=high --json \
              > ../../artifacts/security/frontend.json
          ) || status=1
          exit "$status"
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-security
          path: artifacts/security/
          if-no-files-found: error
